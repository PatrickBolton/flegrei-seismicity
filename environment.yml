# Conda environment for this project.
# Create with:  conda env create -f environment.yml
# Python packages and their versions live in requirements.txt.
name: flegrei-seismicity
channels:
  - conda-forge
dependencies:
  - python=3.14
  - llvm-openmp      # C library LightGBM needs for multi-threading
  - pip
  - pip:
      - -r requirements.txt
      - -e .         # this project's src/ package (see pyproject.toml)
